<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="35%" r="36%">
      <stop offset="0%" stop-color="#388BFD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#388BFD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="86%" cy="68%" r="34%">
      <stop offset="0%" stop-color="#8957E5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8957E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A371F7" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9D8F0"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="barPeak" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#388BFD" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#79C0FF" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B949E" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#8B949E" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="1276" height="336" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="1276" height="336" fill="url(#bg)"/>
    <rect x="2" y="2" width="1276" height="336" fill="url(#grid)"/>
    <rect x="2" y="2" width="1276" height="336" fill="url(#glowLeft)"/>
    <rect x="2" y="2" width="1276" height="336" fill="url(#glowRight)"/>
    <rect x="2" y="2" width="1276" height="3" fill="url(#topBar)"/>

    <!-- Left Motif: Red-Black Binary Tree -->
    <g>
      <circle cx="152" cy="172" r="92" stroke="#58A6FF" stroke-opacity="0.09" stroke-width="1" stroke-dasharray="4 6"/>
      <g stroke="#58A6FF" stroke-opacity="0.32" stroke-width="1.8" stroke-linecap="round">
        <line x1="152" y1="100" x2="104" y2="168"/>
        <line x1="152" y1="100" x2="200" y2="168"/>
        <line x1="104" y1="168" x2="78" y2="232"/>
        <line x1="104" y1="168" x2="130" y2="232"/>
        <line x1="200" y1="168" x2="174" y2="232"/>
        <line x1="200" y1="168" x2="226" y2="232"/>
      </g>
      <!-- Root (Black node) -->
      <circle cx="152" cy="100" r="12" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
      <circle cx="152" cy="100" r="3.5" fill="#79C0FF"/>
      <!-- Level 1: Red & Black -->
      <circle cx="104" cy="168" r="10" fill="#161B22" stroke="#F78166" stroke-width="2"/>
      <circle cx="104" cy="168" r="3" fill="#FFA198"/>
      <circle cx="200" cy="168" r="10" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
      <circle cx="200" cy="168" r="3" fill="#79C0FF"/>
      <!-- Level 2 -->
      <circle cx="78" cy="232" r="7" fill="#161B22" stroke="#388BFD" stroke-opacity="0.8" stroke-width="1.6"/>
      <circle cx="130" cy="232" r="7" fill="#161B22" stroke="#388BFD" stroke-opacity="0.8" stroke-width="1.6"/>
      <circle cx="174" cy="232" r="7" fill="#161B22" stroke="#F78166" stroke-opacity="0.85" stroke-width="1.6"/>
      <circle cx="226" cy="232" r="7" fill="#161B22" stroke="#388BFD" stroke-opacity="0.8" stroke-width="1.6"/>
    </g>

    <!-- Right Motif: Fenwick Tree lowbit(i) Visualization Card -->
    <g>
      <rect x="1032" y="84" width="192" height="172" rx="12" fill="#161B22" fill-opacity="0.78" stroke="#30363D" stroke-width="1.2"/>
      <circle cx="1050" cy="102" r="3.5" fill="#F78166" fill-opacity="0.75"/>
      <circle cx="1063" cy="102" r="3.5" fill="#D29922" fill-opacity="0.75"/>
      <circle cx="1076" cy="102" r="3.5" fill="#3FB950" fill-opacity="0.75"/>
      <text x="1208" y="106" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#79C0FF" fill-opacity="0.9">O(log n)</text>
      <line x1="1044" y1="116" x2="1212" y2="116" stroke="#30363D" stroke-width="1"/>
      <!-- 8 Fenwick lowbit bars: 1, 2, 1, 4, 1, 2, 1, 8 -->
      <rect x="1052" y="206" width="12" height="16" rx="3" fill="url(#barGrad)"/>
      <rect x="1072" y="190" width="12" height="32" rx="3" fill="url(#barGrad)"/>
      <rect x="1092" y="206" width="12" height="16" rx="3" fill="url(#barGrad)"/>
      <rect x="1112" y="166" width="12" height="56" rx="3" fill="url(#barPeak)"/>
      <rect x="1132" y="206" width="12" height="16" rx="3" fill="url(#barGrad)"/>
      <rect x="1152" y="190" width="12" height="32" rx="3" fill="url(#barGrad)"/>
      <rect x="1172" y="206" width="12" height="16" rx="3" fill="url(#barGrad)"/>
      <rect x="1192" y="134" width="12" height="88" rx="3" fill="url(#barPeak)"/>
      <line x1="1046" y1="224" x2="1210" y2="224" stroke="#30363D" stroke-width="1"/>
      <text x="1128" y="242" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#8B949E">fenwick · bit[0..n-1]</text>
    </g>

    <!-- Center Typography -->
    <g>
      <!-- Location / Institution Pill -->
      <rect x="520" y="50" width="240" height="28" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="539" cy="64" r="3.5" fill="#58A6FF"/>
      <text x="646" y="68" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" letter-spacing="1.4" fill="#9EB3C8">CIn-UFPE · RECIFE, BR</text>

      <!-- Name -->
      <text x="640" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.8" fill="url(#titleGrad)">Ewerton Manoel</text>

      <!-- Subtitle -->
      <text x="640" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19.5" font-weight="500" fill="#8B949E">Computer Engineering Student  ·  Algorithms &amp; Systems</text>

      <!-- Divider -->
      <line x1="450" y1="216" x2="830" y2="216" stroke="url(#dividerGrad)" stroke-width="1.5"/>

      <!-- Focus Pills -->
      <g font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12.5" font-weight="500" fill="#79C0FF">
        <rect x="344" y="242" width="118" height="32" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="403" y="262.5" text-anchor="middle">Modern C++</text>

        <rect x="474" y="242" width="118" height="32" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="533" y="262.5" text-anchor="middle">Algorithms</text>

        <rect x="604" y="242" width="156" height="32" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="682" y="262.5" text-anchor="middle">Data Structures</text>

        <rect x="772" y="242" width="164" height="32" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="854" y="262.5" text-anchor="middle">Embedded Systems</text>
      </g>
    </g>
  </g>

  <rect x="2" y="2" width="1276" height="336" rx="16" stroke="#30363D" stroke-width="1.5"/>
</svg>
