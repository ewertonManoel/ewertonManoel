<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="13%" cy="50%" r="32%">
      <stop offset="0%" stop-color="#388BFD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#388BFD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="87%" cy="50%" r="32%">
      <stop offset="0%" stop-color="#8957E5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8957E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A371F7" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9D8F0"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B949E" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#8B949E" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="1276" height="336" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="1276" height="336" fill="url(#bg)"/>
    <rect x="2" y="2" width="1276" height="336" fill="url(#grid)"/>
    <rect x="2" y="2" width="1276" height="336" fill="url(#glowLeft)"/>
    <rect x="2" y="2" width="1276" height="336" fill="url(#glowRight)"/>
    <rect x="2" y="2" width="1276" height="3" fill="url(#topBar)"/>

    <!-- Left Motif: Red-Black Binary Tree (Algorithms & Data Structures) -->
    <g>
      <circle cx="146" cy="172" r="86" stroke="#58A6FF" stroke-opacity="0.11" stroke-width="1" stroke-dasharray="4 6"/>
      <g stroke="#58A6FF" stroke-opacity="0.34" stroke-width="1.8" stroke-linecap="round">
        <line x1="146" y1="104" x2="100" y2="168"/>
        <line x1="146" y1="104" x2="192" y2="168"/>
        <line x1="100" y1="168" x2="76" y2="230"/>
        <line x1="100" y1="168" x2="124" y2="230"/>
        <line x1="192" y1="168" x2="168" y2="230"/>
        <line x1="192" y1="168" x2="216" y2="230"/>
      </g>
      <circle cx="146" cy="104" r="11.5" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
      <circle cx="146" cy="104" r="3.5" fill="#79C0FF"/>

      <circle cx="100" cy="168" r="9.5" fill="#161B22" stroke="#F78166" stroke-width="2"/>
      <circle cx="100" cy="168" r="3" fill="#FFA198"/>
      <circle cx="192" cy="168" r="9.5" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
      <circle cx="192" cy="168" r="3" fill="#79C0FF"/>

      <circle cx="76" cy="230" r="6.5" fill="#161B22" stroke="#388BFD" stroke-opacity="0.85" stroke-width="1.6"/>
      <circle cx="124" cy="230" r="6.5" fill="#161B22" stroke="#388BFD" stroke-opacity="0.85" stroke-width="1.6"/>
      <circle cx="168" cy="230" r="6.5" fill="#161B22" stroke="#F78166" stroke-opacity="0.85" stroke-width="1.6"/>
      <circle cx="216" cy="230" r="6.5" fill="#161B22" stroke="#388BFD" stroke-opacity="0.85" stroke-width="1.6"/>
    </g>

    <!-- Right Motif: Processor / Silicon Die (Computer Engineering & Embedded Systems) -->
    <g>
      <circle cx="1134" cy="172" r="86" stroke="#A371F7" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
      <!-- Circuit Pins -->
      <g stroke="#58A6FF" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
        <!-- Top pins -->
        <line x1="1104" y1="124" x2="1104" y2="102"/>
        <line x1="1124" y1="124" x2="1124" y2="102"/>
        <line x1="1144" y1="124" x2="1144" y2="102"/>
        <line x1="1164" y1="124" x2="1164" y2="102"/>
        <!-- Bottom pins -->
        <line x1="1104" y1="220" x2="1104" y2="242"/>
        <line x1="1124" y1="220" x2="1124" y2="242"/>
        <line x1="1144" y1="220" x2="1144" y2="242"/>
        <line x1="1164" y1="220" x2="1164" y2="242"/>
        <!-- Left pins -->
        <line x1="1086" y1="142" x2="1064" y2="142"/>
        <line x1="1086" y1="162" x2="1064" y2="162"/>
        <line x1="1086" y1="182" x2="1064" y2="182"/>
        <line x1="1086" y1="202" x2="1064" y2="202"/>
        <!-- Right pins -->
        <line x1="1182" y1="142" x2="1204" y2="142"/>
        <line x1="1182" y1="162" x2="1204" y2="162"/>
        <line x1="1182" y1="182" x2="1204" y2="182"/>
        <line x1="1182" y1="202" x2="1204" y2="202"/>
      </g>
      <!-- Pin Solder Pads -->
      <g fill="#79C0FF" fill-opacity="0.75">
        <circle cx="1104" cy="100" r="2.5"/><circle cx="1124" cy="100" r="2.5"/><circle cx="1144" cy="100" r="2.5"/><circle cx="1164" cy="100" r="2.5"/>
        <circle cx="1104" cy="244" r="2.5"/><circle cx="1124" cy="244" r="2.5"/><circle cx="1144" cy="244" r="2.5"/><circle cx="1164" cy="244" r="2.5"/>
        <circle cx="1062" cy="142" r="2.5"/><circle cx="1062" cy="162" r="2.5"/><circle cx="1062" cy="182" r="2.5"/><circle cx="1062" cy="202" r="2.5"/>
        <circle cx="1206" cy="142" r="2.5"/><circle cx="1206" cy="162" r="2.5"/><circle cx="1206" cy="182" r="2.5"/><circle cx="1206" cy="202" r="2.5"/>
      </g>
      <!-- IC Package -->
      <rect x="1086" y="124" width="96" height="96" rx="14" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
      <!-- Pin-1 orientation marker -->
      <circle cx="1097" cy="135" r="2.8" fill="#F78166"/>
      <!-- Inner Die -->
      <rect x="1102" y="140" width="64" height="64" rx="8" fill="#0D1117" stroke="#388BFD" stroke-opacity="0.6" stroke-width="1.5"/>
      <!-- Internal bus lines -->
      <g stroke="#58A6FF" stroke-opacity="0.28" stroke-width="1.2">
        <line x1="1134" y1="140" x2="1134" y2="156"/>
        <line x1="1134" y1="188" x2="1134" y2="204"/>
        <line x1="1102" y1="172" x2="1118" y2="172"/>
        <line x1="1150" y1="172" x2="1166" y2="172"/>
      </g>
      <!-- Silicon Core -->
      <rect x="1118" y="156" width="32" height="32" rx="6" fill="url(#coreGrad)" stroke="#79C0FF" stroke-width="1.5"/>
      <circle cx="1134" cy="172" r="4" fill="#79C0FF"/>
    </g>

    <!-- Center Typography -->
    <g>
      <!-- Location / Institution Pill (Larger & Crisp) -->
      <rect x="480" y="40" width="320" height="36" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
      <circle cx="504" cy="58" r="4.5" fill="#58A6FF"/>
      <text x="648" y="63.5" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="16" font-weight="600" letter-spacing="1.4" fill="#C9D1D9">CIn-UFPE · RECIFE, BR</text>

      <!-- Name -->
      <text x="640" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.8" fill="url(#titleGrad)">Ewerton Manoel</text>

      <!-- Subtitle -->
      <text x="640" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#9EB3C8">Computer Engineering Student  ·  Algorithms &amp; Systems</text>

      <!-- Divider -->
      <line x1="430" y1="216" x2="850" y2="216" stroke="url(#dividerGrad)" stroke-width="1.5"/>

      <!-- Focus Pills (Larger & High Legibility) -->
      <g font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="16" font-weight="600" fill="#79C0FF">
        <rect x="286" y="240" width="140" height="40" rx="20" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
        <text x="356" y="265.5" text-anchor="middle">Modern C++</text>

        <rect x="440" y="240" width="140" height="40" rx="20" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
        <text x="510" y="265.5" text-anchor="middle">Algorithms</text>

        <rect x="594" y="240" width="188" height="40" rx="20" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
        <text x="688" y="265.5" text-anchor="middle">Data Structures</text>

        <rect x="796" y="240" width="198" height="40" rx="20" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
        <text x="895" y="265.5" text-anchor="middle">Embedded Systems</text>
      </g>
    </g>
  </g>

  <rect x="2" y="2" width="1276" height="336" rx="16" stroke="#30363D" stroke-width="1.5"/>
</svg>
